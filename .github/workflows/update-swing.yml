name: Atualizar swing trade e publicar painel

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_swing_market_data.py"
      - "swing/**"
      - ".github/workflows/update-swing.yml"
  schedule:
    - cron: "0 22 * * 1-5"
      timezone: "America/Recife"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Consultar cotações exclusivas do swing trade
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_SWING_API_KEY || secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/update_swing_market_data.py

      - name: Publicar cache independente de swing trade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swing/data/market-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza cotações do swing trade"
            git pull --rebase origin main
            git push
          else
            echo "Nenhuma alteração nos dados do swing trade."
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório atualizado
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar os dois aplicativos
        run: |
          mkdir -p _site/data _site/swing
          cp index.html _site/index.html
          cp data/market-data.json _site/data/market-data.json
          cp -R swing/. _site/swing/

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
