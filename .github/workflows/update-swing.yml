name: Atualizar swing trade

on:
  schedule:
    # Swing trade: 22h00 no horário de Recife, dias úteis.
    - cron: "0 22 * * 1-5"
      timezone: "America/Recife"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing-trade-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Consultar cotações exclusivas do swing trade
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_SWING_API_KEY || secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/update_swing_market_data.py

      - name: Publicar cache independente de swing trade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swing/data/market-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza cotações do swing trade"
            git pull --rebase origin main
            git push
          else
            echo "Nenhuma alteração nos dados do swing trade."
          fi
